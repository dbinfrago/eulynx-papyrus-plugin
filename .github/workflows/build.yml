name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B org.eclipse.tycho:tycho-versions-plugin:5.0.4:set-version -DnewVersion="${VERSION}"
      - name: Build
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: target/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: target
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/com.eulynx.papyrus.specification-*.jar "com.eulynx.papyrus.specification_${VERSION}.jar"
          gh release create "$GITHUB_REF_NAME" "com.eulynx.papyrus.specification_${VERSION}.jar" --generate-notes
